version: "3.9"

services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: ride-hailing-db
    environment:
      POSTGRES_USER: ridehail
      POSTGRES_PASSWORD: ridehail_pass
      POSTGRES_DB: ridehailing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-pgrouting.sh:/docker-entrypoint-initdb.d/init-pgrouting.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridehail -d ridehailing"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ride-hailing-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
