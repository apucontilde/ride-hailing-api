            operationId: putRider-me-preferences
            responses:
                "200":
                    description: OK
            security:
                - BearerAuth: []
            summary: PUT /api/v1/rider/me/preferences
            tags:
                - rider
    /api/v1/rider/me/status:
        put:
            consumes:
                - application/json
            operationId: putRider-me-status
            parameters:
                - description: New status (e.g. idle)
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.updateStatusRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.RiderResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Update the rider status
            tags:
                - rider
    /api/v1/rider/payment-methods:
        get:
            operationId: getRider-payment-methods
            responses:
                "200":
                    description: OK
            security:
                - BearerAuth: []
            summary: GET /api/v1/rider/payment-methods
            tags:
                - rider
        post:
            operationId: postRider-payment-methods
            responses:
                "200":
                    description: OK
            security:
                - BearerAuth: []
            summary: POST /api/v1/rider/payment-methods
            tags:
                - rider
    /api/v1/rider/payment-methods/{id}:
        delete:
            operationId: deleteRider-payment-methods-ByID
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
            security:
                - BearerAuth: []
            summary: DELETE /api/v1/rider/payment-methods/{id}
            tags:
                - rider
    /api/v1/rider/ratings:
        get:
            description: Returns a paginated list of ratings the current rider or driver submitted.
            operationId: getRider-ratings
            parameters:
                - default: 1
                  description: Page number
                  in: query
                  name: page
                  type: integer
                - default: 20
                  description: Items per page (max 50)
                  in: query
                  name: per_page
                  type: integer
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.RatingListResponse'
                "500":
                    description: Query failed
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: List submitted ratings
            tags:
                - rides
    /api/v1/rides:
        post:
            consumes:
                - application/json
            description: Creates a ride request and dispatches it to nearby drivers.
            operationId: postRides
            parameters:
                - description: Ride request
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.rideRequest'
            produces:
                - application/json
            responses:
                "201":
                    description: Created
                    schema:
                        $ref: '#/definitions/handler.RideWithStopsResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "500":
                    description: Failed to create ride
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Request a new ride
            tags:
                - rides
    /api/v1/rides/{id}:
        get:
            operationId: getRides-ByID
            parameters:
                - description: Ride ID
                  in: path
                  name: id
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.RideWithStopsResponse'
                "404":
                    description: Ride not found
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Get a ride by ID
            tags:
                - rides
    /api/v1/rides/{id}/cancel:
        post:
            operationId: postRides-ByID-cancel
            parameters:
                - description: Ride ID
                  in: path
                  name: id
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.RideResponse'
                "400":
                    description: Ride cannot be cancelled
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Cancel a ride
            tags:
                - rides
    /api/v1/rides/{id}/destination:
        put:
            consumes:
                - application/json
            description: |-
                Changes the final destination of a ride that is still open
                (pending, accepted, driver_arrived or in_progress).
                Only the ride's own rider may do this, and only the ride's own
                rider. The booking-time fare is unchanged and no status transition
                occurs: this is a data mutation. Re-request
                `GET /api/v1/navigation/route` for the new leg.
            operationId: putRides-ByID-destination
            parameters:
                - description: Ride ID
                  in: path
                  name: id
                  required: true
                  type: string
                - description: New destination
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.changeDestinationRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.RideWithStopsResponse'
                "400":
                    description: Malformed request body
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "404":
                    description: Ride not found
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "409":
                    description: Ride destination can no longer be changed
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "500":
                    description: Failed to update ride destination
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Change a ride's destination
            tags:
                - rides
    /api/v1/rides/{id}/rate:
        post:
            consumes:
                - application/json
            description: Submits a 1-5 rating for the other party on a completed ride.
            operationId: postRides-ByID-rate
            parameters:
                - description: Ride ID
                  in: path
                  name: id
                  required: true
                  type: string
                - description: Rating payload
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.rateRideRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.MessageResponse'
                "400":
                    description: Invalid rating
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "404":
                    description: Ride not found
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Rate a completed ride
            tags:
                - rides
    /api/v1/rides/{id}/receipt:
        get:
            operationId: getRides-ByID-receipt
            parameters:
                - description: Ride ID
                  in: path
                  name: id
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.RideReceiptResponse'
                "404":
                    description: Ride not found
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Get the fare breakdown for a ride
            tags:
                - rides
    /api/v1/rides/{id}/tip:
        post:
            operationId: postRides-ByID-tip
            parameters:
                - description: Ride ID
                  in: path
                  name: id
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.StubResponse'
            security:
                - BearerAuth: []
            summary: Tip a driver (stub)
            tags:
                - rides
    /api/v1/rides/current:
        get:
            description: |-
                Returns the active ride for the current rider or driver, or `null`.
                The ordered `stops` itinerary is a sibling of `ride` and is
                always present (`[]` when there is no current ride).
            operationId: getRides-current
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.RideWithStopsResponse'
                "500":
                    description: Failed to load ride stops
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Get the current ride for the authenticated user
            tags:
                - rides
    /api/v1/rides/history:
        get:
            description: |-
                Returns a paginated list of past rides for the current rider or driver.
                `stops` is a sibling map of ride id to that ride's ordered
                itinerary, loaded in one query; `rides` is unchanged.
            operationId: getRides-history
            parameters:
                - default: 1
                  description: Page number
                  in: query
                  name: page
                  type: integer
                - default: 20
                  description: Items per page (max 50)
                  in: query
                  name: per_page
                  type: integer
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.RideListResponse'
                "500":
                    description: Query failed
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: List ride history
            tags:
                - rides
    /api/v1/sos:
        post:
            consumes:
                - application/json
            operationId: postSos
            parameters:
                - description: SOS request
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.sosRequest'
            produces:
                - application/json
            responses:
                "201":
                    description: Created
                    schema:
                        $ref: '#/definitions/handler.SOSResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Send an SOS alert
            tags:
                - platform
    /api/v1/version:
        get:
            operationId: getVersion
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.VersionResponse'
            summary: Get the API version
            tags:
                - platform
    /health:
        get:
            description: Returns the liveness status of the server process.
            operationId: getHealth
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.HealthResponse'
            summary: Liveness probe
            tags:
                - health
    /health/ready:
        get:
            description: Returns readiness status including dependency checks (database, redis).
            operationId: getHealth-ready
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.ReadinessResponse'
                "503":
                    description: Service Unavailable
                    schema:
                        $ref: '#/definitions/handler.ReadinessResponse'
            summary: Readiness probe
            tags:
                - health
    /ws:
        get:
            operationId: getWs
            responses:
                "200":
                    description: OK
            security:
                - BearerAuth: []
            summary: GET /ws
            tags:
                - default
securityDefinitions:
    BearerAuth:
        description: 'JWT access token. Include as `Authorization: Bearer <token>`.'
        in: header
        name: Authorization
        type: apiKey
swagger: "2.0"
