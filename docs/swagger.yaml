basePath: /
definitions:
    handler.DeviceResponse:
        properties:
            device:
                $ref: '#/definitions/model.DeviceToken'
            message:
                type: string
        type: object
    handler.DriverLocationResponse:
        properties:
            driver_id:
                type: string
            heading:
                type: number
            lat:
                type: number
            lng:
                type: number
            speed:
                type: number
            status:
                type: string
            updated_at:
                type: string
        type: object
    handler.DriverResponse:
        properties:
            driver:
                $ref: '#/definitions/model.Driver'
        type: object
    handler.DriverRiderInfoResponse:
        properties:
            rider:
                properties:
                    name:
                        type: string
                    rating:
                        type: number
                type: object
        type: object
    handler.ErrorDetail:
        properties:
            code:
                type: string
            message:
                type: string
        type: object
    handler.ErrorResponse:
        properties:
            error:
                $ref: '#/definitions/handler.ErrorDetail'
        type: object
    handler.Estimate:
        properties:
            base_fare:
                type: number
            distance_fare:
                type: number
            distance_rate:
                type: number
            surge_multiplier:
                type: number
            time_fare:
                type: number
            time_rate:
                type: number
            total:
                type: number
            vehicle_type:
                type: string
        type: object
    handler.EstimatesETAResponse:
        properties:
            distance_meters:
                type: integer
            eta_seconds:
                type: integer
            is_estimate:
                type: boolean
        type: object
    handler.EstimatesPriceResponse:
        properties:
            estimates:
                items:
                    $ref: '#/definitions/handler.Estimate'
                type: array
        type: object
    handler.FeedbackResponse:
        properties:
            feedback:
                $ref: '#/definitions/model.Feedback'
            message:
                type: string
        type: object
    handler.GeocodeResponse:
        properties:
            place: {}
        type: object
    handler.HealthResponse:
        properties:
            status:
                type: string
        type: object
    handler.HeatmapResponse:
        properties:
            tiles:
                type: string
        type: object
    handler.LoginResponse:
        properties:
            access_token:
                type: string
            refresh_token:
                type: string
            user:
                $ref: '#/definitions/handler.UserSummary'
        type: object
    handler.MessageResponse:
        properties:
            message:
                type: string
        type: object
    handler.NavigationRouteResponse:
        properties:
            elevation_aware:
                type: boolean
            is_estimate:
                type: boolean
            polyline:
                items:
                    $ref: '#/definitions/handler.PolylinePoint'
                type: array
            total_ascent_m:
                type: number
            total_descent_m:
                type: number
            total_distance_m:
                type: number
            total_duration_s:
                type: number
        type: object
    handler.NearbyDriversResponse:
        properties:
            drivers: {}
        type: object
    handler.PlacesResponse:
        properties:
            places: {}
        type: object
    handler.PolylinePoint:
        properties:
            lat:
                type: number
            lng:
                type: number
        type: object
    handler.PromotionsResponse:
        properties:
            promotions: {}
        type: object
    handler.QueueResponse:
        properties:
            queue: {}
        type: object
    handler.RatingItem:
        properties:
            comment:
                type: string
            created_at:
                type: string
            id:
                type: string
            rater_role:
                type: string
            ride_id:
                type: string
            score:
                type: integer
        type: object
    handler.RatingListResponse:
        properties:
            page:
                type: integer
            per_page:
                type: integer
            ratings:
                items:
                    $ref: '#/definitions/handler.RatingItem'
                type: array
            total:
                type: integer
            total_pages:
                type: integer
        type: object
    handler.ReadinessResponse:
        properties:
            checks:
                additionalProperties:
                    type: string
                type: object
            status:
                type: string
        type: object
    handler.RegisterResponse:
        properties:
            user:
                $ref: '#/definitions/handler.UserSummary'
        type: object
    handler.RideListResponse:
        properties:
            page:
                type: integer
            per_page:
                type: integer
            rides: {}
            stops:
                additionalProperties:
                    items:
                        $ref: '#/definitions/model.RideStop'
                    type: array
                description: |-
                    Stops is the itinerary of every ride on the page, keyed by ride id and
                    fetched in ONE query. It is a sibling of `rides`, so `rides` stays the flat
                    array an older client already parses. A ride with no itinerary maps to an
                    empty array, never a missing key.
                type: object
            total:
                type: integer
            total_pages:
                type: integer
        type: object
    handler.RideReceiptResponse:
        properties:
            receipt:
                properties:
                    base_fare:
                        type: number
                    distance_fare:
                        type: number
                    surge_multiplier:
                        type: number
                    time_fare:
                        type: number
                    total:
                        type: number
                type: object
        type: object
    handler.RideResponse:
        properties:
            ride:
                $ref: '#/definitions/model.Ride'
        type: object
    handler.RideWithStopsResponse:
        properties:
            ride:
                $ref: '#/definitions/model.Ride'
            stops:
                items:
                    $ref: '#/definitions/model.RideStop'
                type: array
        type: object
    handler.RiderProfileResponse:
        properties:
            rider:
                $ref: '#/definitions/model.Rider'
            user:
                $ref: '#/definitions/handler.UserSummary'
        type: object
    handler.RiderResponse:
        properties:
            rider:
                $ref: '#/definitions/model.Rider'
        type: object
    handler.SOSResponse:
        properties:
            alert:
                properties:
                    lat:
                        type: number
                    lng:
                        type: number
                    status:
                        type: string
                    user_id:
                        type: string
                type: object
            message:
                type: string
        type: object
    handler.StubResponse:
        properties:
            message:
                type: string
            status:
                type: string
        type: object
    handler.TokenPair:
        properties:
            access_token:
                type: string
            refresh_token:
                type: string
        type: object
    handler.UserSummary:
        properties:
            email:
                type: string
            id:
                type: string
            phone:
                type: string
            role:
                type: string
            status:
                type: string
        type: object
    handler.VersionResponse:
        properties:
            commit:
                type: string
            version:
                type: string
        type: object
    handler.changeDestinationRequest:
        properties:
            address:
                description: |-
                    Address is optional; omitting it clears the stored address rather than
                    keeping a stale one, because the coordinates no longer match it.
                type: string
            lat:
                type: number
            lng:
                type: number
        required:
            - lat
            - lng
        type: object
    handler.deviceRegisterRequest:
        properties:
            platform:
                enum:
                    - ios
                    - android
                    - web
                type: string
            token:
                type: string
        required:
            - platform
            - token
        type: object
    handler.feedbackRequest:
        properties:
            message:
                type: string
            ride_id:
                type: string
            type:
                type: string
        required:
            - message
        type: object
    handler.forgotPasswordRequest:
        properties:
            email:
                type: string
        required:
            - email
        type: object
    handler.locationUpdate:
        properties:
            heading:
                type: number
            lat:
                type: number
            lng:
                type: number
            speed:
                type: number
        required:
            - lat
            - lng
        type: object
    handler.loginRequest:
        properties:
            email:
                type: string
            password:
                type: string
        required:
            - email
            - password
        type: object
    handler.logoutRequest:
        properties:
            refresh_token:
                type: string
        required:
            - refresh_token
        type: object
    handler.rateRideRequest:
        properties:
            comment:
                type: string
            score:
                type: integer
        required:
            - score
        type: object
    handler.refreshRequest:
        properties:
            refresh_token:
                type: string
        required:
            - refresh_token
        type: object
    handler.registerRequest:
        properties:
            email:
                type: string
            password:
                minLength: 8
                type: string
            phone:
                type: string
        required:
            - email
            - password
            - phone
        type: object
    handler.resetPasswordRequest:
        properties:
            new_password:
                minLength: 8
                type: string
            token:
                type: string
        required:
            - new_password
            - token
        type: object
    handler.rideRequest:
        properties:
            dropoff_address:
                type: string
            dropoff_lat:
                type: number
            dropoff_lng:
                type: number
            pickup_address:
                type: string
            pickup_lat:
                type: number
            pickup_lng:
                type: number
            stops:
                description: |-
                    Stops is the ordered list of INTERMEDIATE waypoints, pickup excluded.
                    Optional, so a body without it is byte-identical to the pre-016 request.
                    Order in the array IS the visit order; no sequence is accepted. The final
                    destination is never sent here — it is dropoff_lat/dropoff_lng/
                    dropoff_address. See service.BuildItinerary for the rules.
                items:
                    $ref: '#/definitions/handler.stopRequest'
                type: array
            vehicle_type:
                type: string
        required:
            - dropoff_lat
            - dropoff_lng
            - pickup_lat
            - pickup_lng
        type: object
    handler.socialLoginRequest:
        properties:
            provider:
                type: string
            token:
                type: string
        required:
            - provider
            - token
        type: object
    handler.sosRequest:
        properties:
            lat:
                type: number
            lng:
                type: number
        required:
            - lat
            - lng
        type: object
    handler.stopRequest:
        properties:
            address:
                type: string
            kind:
                description: |-
                    Kind is optional and, when present, must be "stop". A "destination" stop
                    is rejected: the final destination is defined solely by the top-level
                    dropoff_lat/dropoff_lng/dropoff_address, so no client stop may claim it.
                type: string
            lat:
                description: |-
                    Lat and Lng are REQUIRED on every stop: an absent coordinate is a 422, and
                    0 is a legitimate value, so presence cannot be inferred from the number.
                type: number
            lng:
                type: number
        type: object
    handler.updateDriverRequest:
        properties:
            first_name:
                type: string
            last_name:
                type: string
            photo_url:
                type: string
        type: object
    handler.updateRideStatusRequest:
        properties:
            status:
                type: string
        required:
            - status
        type: object
    handler.updateRiderRequest:
        properties:
            first_name:
                type: string
            last_name:
                type: string
            phone:
                type: string
            photo_url:
                type: string
        type: object
    handler.updateStatusRequest:
        properties:
            status:
                type: string
        required:
            - status
        type: object
    handler.verifyCodeRequest:
        properties:
            code:
                type: string
        required:
            - code
        type: object
    model.DeviceToken:
        properties:
            created_at:
                type: string
            id:
                type: string
            is_active:
                type: boolean
            platform:
                type: string
            token:
                type: string
            updated_at:
                type: string
            user_id:
                type: string
        type: object
    model.Driver:
        properties:
            created_at:
                type: string
            first_name:
                type: string
            last_name:
                type: string
            onboarding_status:
                type: string
            photo_url:
                type: string
            rating_summary:
                type: string
            status:
                type: string
            updated_at:
                type: string
            user_id:
                type: string
        type: object
    model.Feedback:
        properties:
            created_at:
                type: string
            id:
                type: string
            message:
                type: string
            ride_id:
                type: string
            type:
                description: |-
                    Type is the client-supplied classification (e.g. "app_issue"). Optional:
                    a body without it stores "" so pre-existing clients keep working.
                type: string
            user_id:
                type: string
        type: object
    model.Ride:
        properties:
            accepted_at:
                type: string
            base_fare:
                type: number
            cancellation_fee:
                type: number
            cancelled_at:
                type: string
            completed_at:
                type: string
            created_at:
                type: string
            distance_fare:
                type: number
            driver_arrived_at:
                type: string
            driver_id:
                type: string
            dropoff_address:
                type: string
            dropoff_lat:
                type: number
            dropoff_lng:
                type: number
            id:
                type: string
            pickup_address:
                type: string
            pickup_lat:
                type: number
            pickup_lng:
                type: number
            requested_at:
                type: string
            rider_id:
                type: string
            started_at:
                type: string
            status:
                type: string
            surge_multiplier:
                type: number
            time_fare:
                type: number
            total_fare:
                type: number
            updated_at:
                type: string
            vehicle_type:
                type: string
        type: object
    model.RideStop:
        properties:
            address:
                type: string
            created_at:
                type: string
            id:
                type: string
            kind:
                type: string
            lat:
                type: number
            lng:
                type: number
            ride_id:
                type: string
            sequence:
                type: integer
            updated_at:
                type: string
        type: object
    model.Rider:
        properties:
            created_at:
                type: string
            first_name:
                type: string
            last_name:
                type: string
            photo_url:
                type: string
            status:
                type: string
            updated_at:
                type: string
            user_id:
                type: string
        type: object
host: localhost:8080
info:
    contact: {}
    description: 'Go + Gin ride-hailing backend: auth, rides, driver dispatch, geolocation, navigation, and places.'
    title: Ride-Hailing API
    version: 0.1.0
paths:
    /api/v1/auth/forgot-password:
        post:
            consumes:
                - application/json
            description: Triggers a password reset flow for the given email. A reset token is returned in development.
            operationId: postAuth-forgot-password
            parameters:
                - description: Forgot password request
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.forgotPasswordRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.MessageResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "500":
                    description: Request failed
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            summary: Request a password reset
            tags:
                - auth
    /api/v1/auth/login:
        post:
            consumes:
                - application/json
            description: Authenticates credentials and returns access and refresh tokens.
            operationId: postAuth-login
            parameters:
                - description: Login request
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.loginRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.LoginResponse'
                "401":
                    description: Invalid credentials
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            summary: Log in a user
            tags:
                - auth
    /api/v1/auth/logout:
        post:
            consumes:
                - application/json
            description: Revokes the supplied refresh token.
            operationId: postAuth-logout
            parameters:
                - description: Logout request
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.logoutRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.MessageResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "500":
                    description: Revocation failed
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Log out a user
            tags:
                - auth
    /api/v1/auth/refresh:
        post:
            consumes:
                - application/json
            description: Exchanges a valid refresh token for a new token pair.
            operationId: postAuth-refresh
            parameters:
                - description: Refresh request
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.refreshRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.TokenPair'
                "401":
                    description: Invalid or expired refresh token
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            summary: Refresh an access token
            tags:
                - auth
    /api/v1/auth/register:
        post:
            consumes:
                - application/json
            description: Creates a user account with email, phone, and password. The account starts in the `rider` role.
            operationId: postAuth-register
            parameters:
                - description: Registration request
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.registerRequest'
            produces:
                - application/json
            responses:
                "201":
                    description: Created
                    schema:
                        $ref: '#/definitions/handler.RegisterResponse'
                "409":
                    description: Account already exists
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            summary: Register a new user account
            tags:
                - auth
    /api/v1/auth/reset-password:
        post:
            consumes:
                - application/json
            description: Sets a new password using a reset token obtained from forgot-password.
            operationId: postAuth-reset-password
            parameters:
                - description: Reset password request
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.resetPasswordRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.MessageResponse'
                "400":
                    description: Invalid or expired token
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            summary: Reset a password
            tags:
                - auth
    /api/v1/auth/social:
        post:
            consumes:
                - application/json
            description: Placeholder for OAuth-based social login. Not yet implemented.
            operationId: postAuth-social
            parameters:
                - description: Social login request
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.socialLoginRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.MessageResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            summary: Social login (stub)
            tags:
                - auth
    /api/v1/auth/verify-email:
        post:
            consumes:
                - application/json
            operationId: postAuth-verify-email
            parameters:
                - description: Email verification request
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.verifyCodeRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.MessageResponse'
                "400":
                    description: Invalid code
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Verify the user's email
            tags:
                - auth
    /api/v1/auth/verify-phone:
        post:
            consumes:
                - application/json
            operationId: postAuth-verify-phone
            parameters:
                - description: Phone verification request
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.verifyCodeRequest'
            produces:
                - application/json
            responses:
                "200":
                    description: OK
                    schema:
                        $ref: '#/definitions/handler.MessageResponse'
                "400":
                    description: Invalid code
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Verify the user's phone number
            tags:
                - auth
    /api/v1/device-tokens:
        post:
            consumes:
                - application/json
            description: |-
                Upserts the authenticated user's device token. A token is
                globally unique: registering a token that another user holds
                REASSIGNS it, so the previous user stops receiving pushes to
                it. Re-registering the same token does not duplicate.
            operationId: postDevice-tokens
            parameters:
                - description: Device registration request
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.deviceRegisterRequest'
            produces:
                - application/json
            responses:
                "201":
                    description: Created
                    schema:
                        $ref: '#/definitions/handler.DeviceResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "500":
                    description: Device could not be stored
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Register a push notification device
            tags:
                - platform
    /api/v1/device-tokens/{token}:
        delete:
            description: |-
                Deactivates the authenticated user's token. Idempotent: an
                unknown, already-inactive, or another user's token is a no-op.
            operationId: deleteDevice-tokens-ByID
            parameters:
                - description: Device token
                  in: path
                  name: token
                  required: true
                  type: string
            responses:
                "204":
                    description: No content
                "500":
                    description: Device could not be updated
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Unregister a push notification device
            tags:
                - platform
    /api/v1/devices:
        post:
            consumes:
                - application/json
            description: |-
                Upserts the authenticated user's device token. A token is
                globally unique: registering a token that another user holds
                REASSIGNS it, so the previous user stops receiving pushes to
                it. Re-registering the same token does not duplicate.
            operationId: postDevices
            parameters:
                - description: Device registration request
                  in: body
                  name: body
                  required: true
                  schema:
                    $ref: '#/definitions/handler.deviceRegisterRequest'
            produces:
                - application/json
            responses:
                "201":
                    description: Created
                    schema:
                        $ref: '#/definitions/handler.DeviceResponse'
                "422":
                    description: Validation error
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
                "500":
                    description: Device could not be stored
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Register a push notification device
            tags:
                - platform
    /api/v1/devices/{token}:
        delete:
            description: |-
                Deactivates the authenticated user's token. Idempotent: an
                unknown, already-inactive, or another user's token is a no-op.
            operationId: deleteDevices-ByID
            parameters:
                - description: Device token
                  in: path
                  name: token
                  required: true
                  type: string
            responses:
                "204":
                    description: No content
                "500":
                    description: Device could not be updated
                    schema:
                        $ref: '#/definitions/handler.ErrorResponse'
            security:
                - BearerAuth: []
            summary: Unregister a push notification device
            tags:
