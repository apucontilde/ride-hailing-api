<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="driver_app">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="driver_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>driver_app</title>

  <!--
    E2E hook (integration/ dir, Playwright).

    Flutter web paints into a <canvas>, so its widget tree is invisible to a
    DOM driver. Flutter ships a hidden "Enable accessibility" placeholder
    (`flt-semantics-placeholder`); activating it builds the semantics tree,
    which mirrors every widget into real, focusable, aria-labelled DOM nodes.
    That is what lets the e2e suite read text and click buttons by label.

    Clicking it programmatically (rather than leaving it to a human) is gated
    behind a query flag so normal browsing is untouched: the suite loads
    `/?e2e=1`. `flutter build web` rewrites nothing here, so this survives a
    release build.
  -->
  <script>
    (function () {
      if (!/[?&]e2e=1(&|$)/.test(window.location.search)) return;
      var attempts = 0;
      function enableSemantics() {
        var el = document.querySelector('flt-semantics-placeholder');
        if (el) { el.click(); return; }
        if (++attempts < 200) setTimeout(enableSemantics, 100);
      }
      window.addEventListener('load', enableSemantics);
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
